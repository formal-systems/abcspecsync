\* Trace validation of one recorded run (validate_trace.sh sets LM_TRACE to the file).
\* The constants are those written on the first line of the trace.  The invariants and
\* GrantOrder of the specification are checked on the states of the run as well.
\* CHECK_DEADLOCK is what rejects a trace: a line that cannot be matched leaves no successor.
CONSTANTS
    N <- TraceN
    MaxReq <- TraceMaxReq
SPECIFICATION TraceSpec
INVARIANTS TypeOK Mutex HolderHasRequest OneRequestPerProcess ChannelTimestampsIncrease
PROPERTIES GrantOrder
CHECK_DEADLOCK TRUE
POSTCONDITION TraceAccepted
